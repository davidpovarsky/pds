name: Torah Social Deploy Check

on:
  push:
    branches:
      - codex/torah-social-foundation
    paths:
      - 'torah-social/**'
      - '.github/workflows/torah-social-deploy-check.yml'
  pull_request:
    paths:
      - 'torah-social/**'
      - '.github/workflows/torah-social-deploy-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@v4

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Bash syntax
        run: |
          set -euo pipefail
          bash -n torah-social/install.sh
          bash -n torah-social/deploy-web.sh
          bash -n torah-social/oci-deploy-web.sh

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: ShellCheck
        run: |
          set -euo pipefail
          shellcheck -x torah-social/install.sh
          shellcheck -x torah-social/deploy-web.sh
          shellcheck -x torah-social/oci-deploy-web.sh
