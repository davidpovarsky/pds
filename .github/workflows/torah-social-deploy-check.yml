name: Torah Social Deploy Check

on:
  push:
    branches:
      - codex/torah-social-foundation
    paths:
      - 'torah-social/**'
      - '.github/workflows/torah-social-deploy-check.yml'
  pull_request:
    paths:
      - 'torah-social/**'
      - '.github/workflows/torah-social-deploy-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          set -euo pipefail
          find torah-social -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: |
          set -euo pipefail
          find torah-social -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 shellcheck -x
